name: Discover LinkedIn posts
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: posts-json
  queue: max
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: node scripts/discover-linkedin-posts.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/fetch-dsa-stats.mjs
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/linkedin-posts.json src/data/dsa-stats.json
          git diff --cached --quiet && exit 0
          git commit -m "data: discovered posts & refreshed DSA metrics"
          git pull --rebase origin main
          git push
          gh workflow run deploy.yml --ref main
