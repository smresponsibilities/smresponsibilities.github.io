name: Process Closed Daily Issue

on:
  issues:
    types: [closed]

jobs:
  process_link:
    if: contains(github.event.issue.labels.*.name, 'daily-post')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install beautifulsoup4 requests

      - name: Process Issue and Update JSON
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/process_issue.py

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/linkedin-posts.json
          git commit -m "data: auto-fetch post from closed issue #${{ github.event.issue.number }}" || exit 0
          git push
