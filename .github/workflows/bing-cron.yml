name: Auto Fetch LinkedIn via Bing

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # Run daily at noon UTC

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: posts-json
  queue: max

jobs:
  scrape_bing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4

      - name: Run Bing Fetcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/auto_fetch_bing.py

      - name: Commit and Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/linkedin-posts.json
          git diff --cached --quiet && exit 0
          git commit -m "data: auto-fetch new post via Bing cron"
          git pull --rebase origin main
          git push
          gh workflow run deploy.yml --ref main
