name: Auto Fetch LinkedIn via Bing

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # Run daily at noon UTC

permissions:
  contents: write

jobs:
  scrape_bing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Bing Fetcher
        run: python scripts/auto_fetch_bing.py

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/linkedin-posts.json
          git commit -m "data: auto-fetch new post via Bing cron" || exit 0
          git push
