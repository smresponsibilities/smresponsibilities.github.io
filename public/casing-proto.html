<title>Casing Fidelity Check</title>
<style>
  :root {
    /* Measured off the reference device. These are the reference's own palette --
       the shipped casing takes its colour from the project tokens instead
       (DECISIONS.md S3). Kept literal here so fidelity is checkable. */
    --shell:  linear-gradient(oklch(0.637 0.237 25.331) 0%, oklch(0.505 0.213 27.518) 50%, oklch(0.444 0.177 26.899) 100%);
    --housing: linear-gradient(oklch(0.269 0 0) 0%, oklch(0.205 0 0) 50%, rgb(0,0,0) 100%);
    --well:   linear-gradient(oklch(0.967 0.003 264.542) 0%, oklch(0.928 0.006 264.531) 50%, oklch(0.707 0.022 261.325) 100%);
    --cross:  linear-gradient(in oklab, rgb(224,224,224) 0%, rgb(187,187,189) 50%, rgb(136,136,136) 100%);
    --led:    linear-gradient(oklch(0.792 0.209 151.711) 0%, oklch(0.627 0.194 149.214) 50%, oklch(0.448 0.119 151.328) 100%);
    --well-edge: oklch(0.872 0.01 258.338);
    --ring-edge: oklch(0.707 0.022 261.325);
    --hairline: 0.8px solid #000;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    gap: 20px;
    background: #6f8fa6;
    font: 12px/1.5 ui-monospace, monospace;
    color: #0d1b24;
  }

  /* The device's own bounding box, at the measured 1:1 scale. */
  .dex {
    position: relative;
    width: 595px;
    height: 700.4px;
  }
  .dex * { position: absolute; box-sizing: border-box; }

  /* --- body ------------------------------------------------------------- */
  .half-top    { left:170px; top:0;       width:425px; height:340px;   border-radius:6px 25px 6px 6px; background:var(--shell); border:var(--hairline); }
  .hinge       { left:170px; top:340px;   width:425px; height:20.4px;  border-radius:6px;              background:var(--shell); border:var(--hairline); }
  .half-bottom { left:170px; top:360.4px; width:425px; height:340px;   border-radius:0 0 25px;         background:var(--shell); border:var(--hairline); }
  .hinge-pill  { left:379.1px; top:345.1px; width:6.8px; height:10.2px; border-radius:6px;             background:var(--housing); }

  /* --- lens ------------------------------------------------------------- */
  .lens {
    left:25.5px; top:21.3px; width:144.5px; height:297.5px;
    /* The reference uses an effectively-infinite radius, which CSS clamps to the
       full width horizontally and half the height vertically -- not 50%/50%. */
    border-radius:100% 0 0 100% / 50% 0 0 50%;
    background:var(--shell);
    border:var(--hairline);
    border-right-color: oklch(0.505 0.213 27.518);
  }
  .lens-dot { width:13.6px; height:13.6px; border-radius:50%; background:#000; }
  .lens-dot.a { left:62px;    top:120.6px; }
  .lens-dot.b { left:131.9px; top:120.6px; }
  .lens-dot.c { left:62px;    top:205.8px; }
  .lens-dot.d { left:131.9px; top:205.8px; }

  /* --- side rails ------------------------------------------------------- */
  .rail { background:var(--housing); }
  .rail.tl { left:199.8px; top:31.9px;  width:34px; height:276.3px; border-radius:8px 0 0 8px; }
  .rail.tr { left:531.3px; top:31.9px;  width:34px; height:276.3px; border-radius:0 8px 8px 0; }
  .rail.br { left:531.3px; top:392.3px; width:51px; height:276.3px; border-radius:0 8px 8px 0; border:0.8px solid #fff; }

  .rail-dot { width:17px; height:17px; border-radius:50%; }
  .rail-dot.dark  { left:539.8px; top:161.5px; background:oklch(0.373 0.034 259.733); }
  .rail-dot.light { left:548.3px; background:rgb(224,222,225); }
  .rail-dot.light.one { top:576px; }
  .rail-dot.light.two { top:616.8px; }

  /* --- d-pad ------------------------------------------------------------ */
  .dpad-outer { left:0;      top:360.4px; width:170px;   height:340px;   border-radius:100% 0 0 100% / 50% 0 0 50%; background:var(--housing); border:var(--hairline); }
  .dpad-inner { left:34px;   top:392.3px; width:212.5px; height:276.3px; border-radius:100% 0 0 100% / 50% 0 0 50%; background:var(--housing); border:0.8px solid #fff; z-index:10; }
  .dpad-well  { left:68.7px; top:462.4px; width:136px;   height:136px;   border-radius:50%; background:var(--housing); border:4px solid var(--ring-edge); z-index:11; }
  .cross      { background:var(--cross); border-radius:4px; z-index:12; }
  .cross.h    { left:106.1px; top:523.6px; width:61.2px; height:13.6px; }
  .cross.v    { left:129.9px; top:499.8px; width:13.6px; height:61.2px; }
  .led        { left:0.7px;   top:525.3px; width:20.4px; height:10.2px; background:var(--led); z-index:11; }

  /* --- screen wells (the casing side of the bezel; content sits inside) -- */
  .screen-well {
    left:233.8px; width:297.5px; height:297.5px;
    border-radius:8px;
    background:var(--well);
    border:4px solid var(--well-edge);
    z-index:20;
  }
  .screen-well.top    { top:21.3px; }
  .screen-well.bottom { top:381.7px; }

  .caption { position: static; opacity: 0.75; }
</style>

<div class="dex">
  <div class="half-top"></div>
  <div class="hinge"></div>
  <div class="hinge-pill"></div>
  <div class="half-bottom"></div>

  <div class="lens"></div>
  <div class="lens-dot a"></div>
  <div class="lens-dot b"></div>
  <div class="lens-dot c"></div>
  <div class="lens-dot d"></div>

  <div class="rail tl"></div>
  <div class="rail tr"></div>
  <div class="rail br"></div>
  <div class="rail-dot dark"></div>
  <div class="rail-dot light one"></div>
  <div class="rail-dot light two"></div>

  <div class="dpad-outer"></div>
  <div class="dpad-inner"></div>
  <div class="dpad-well"></div>
  <div class="cross h"></div>
  <div class="cross v"></div>
  <div class="led"></div>

  <div class="screen-well top"></div>
  <div class="screen-well bottom"></div>
</div>

<p class="caption">casing only, 1:1 at measured scale — screen wells left empty</p>
