<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 760" fill="none"><title>Johto · Gold / Silver</title><desc>Authored flat interface asset. Authored front elevation with widened screen apertures. The upper dome now projects above the open leaf and the lower blue orb remains visible at the closed endpoint, matching the GSC artwork. Unseen leaf returns, hinge faces and leaf trajectories remain reconstructed. The two blue orbs are inert; button actions are portfolio adaptations.</desc><defs><mask id="export-gold-gold-hinge-apertures"><rect width="100%" height="100%" fill="white"/></mask></defs><g id="export-gold-hinge" mask="url(#export-gold-gold-hinge-apertures)"><rect x="76" y="354" width="399" height="23" rx="6" fill="#85142b" stroke="#510e21" stroke-width="2"/><path d="M84 361H466" fill="none" stroke="#e45b6d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M128 355V375M145 355V375M407 355V375M424 355V375" fill="none" stroke="#510e21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="478" y="565" width="18" height="125" rx="5" fill="#85142b" stroke="#510e21" stroke-width="2"/><path d="M483 574V681" fill="none" stroke="#e45b6d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M479 589H494M479 673H494" fill="none" stroke="#510e21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>