<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 760" fill="none"><title>Unova · Black / White</title><desc>Authored flat interface asset. Authored red-orange Unova slider. Revision 55 restores warm gray rails, charcoal screen surrounds, and a red-orange lower shell from the original BW artwork; color choices are an interpretation of that reference, not calibrated source measurements. Only the upper screen tray translates vertically, moving down 220 units to cover the lower screen. The source shows orange extended and pink compact; the orange compact state and hidden rails are reconstructed. The three lower dots now sit as a separate row left of the centre control, matching the source artwork without colliding with its well or diagonal band. The central white control opens an entry and the green side control toggles power as portfolio mappings. Bottom slots and dots are inert.</desc><defs><mask id="export-black-black-body-apertures"><rect width="100%" height="100%" fill="white"/><rect x="309" y="344" width="323" height="164" rx="3" fill="black"/></mask></defs><g id="export-black-body" mask="url(#export-black-black-body-apertures)"><defs><linearGradient id="export-black-unova-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c3beb7"/><stop offset=".5" stop-color="#9c9892"/><stop offset="1" stop-color="#686461"/></linearGradient><linearGradient id="export-black-unova-orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5482f"/><stop offset=".52" stop-color="#d43723"/><stop offset="1" stop-color="#a8261d"/></linearGradient></defs><g transform="translate(-117.5 0) scale(1.25 1)"><g stroke="#343636" stroke-width="3" stroke-linejoin="round">
