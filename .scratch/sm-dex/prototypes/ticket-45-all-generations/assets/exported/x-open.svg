<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 760" fill="none"><title>Kalos · X / Y</title><desc>Authored flat interface asset. Authored interpretation of the official X/Y card artwork, also archived at https://archives.bulbagarden.net/wiki/File:XY_Pok%C3%A9dex.png. The upper and lower red halves separate vertically around one transparent cyan display. Their semicircular rims retain a luminous centre and narrow seam when compact. The 126-unit travel per half and concealed screen construction are inferred from still artwork. No physical key functions are established, so navigation uses labelled screen controls.</desc><defs><mask id="export-x-x-display-apertures"><rect width="100%" height="100%" fill="white"/><rect x="274" y="246" width="392" height="268" rx="3" fill="black"/></mask><mask id="export-x-x-upper-card-apertures"><rect width="100%" height="100%" fill="white"/></mask><mask id="export-x-x-lower-card-apertures"><rect width="100%" height="100%" fill="white"/></mask></defs><g id="export-x-display" mask="url(#export-x-x-display-apertures)"><g stroke-linejoin="round">
