<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 760" fill="none"><title>Alola · Sun / Moon</title><desc>Authored flat interface asset. Authored flat Rotom Dex with separate front and rear. The SM concept sheet selected by the user supplies the rear camera module, zigzag arm recesses and round lower cover. The two visible zigzag arm assemblies themselves leave those rear recesses during the turn; no substitute rear side flaps are used. The front arms take over after the half-turn. The rear silhouette mirrors this study’s adapted front. No physical lid is invented. The enlarged screen contains only portfolio content. Fixed eye housings contain tracking irises and blinking lids; extended arms react and the body floats. Motion can be paused.</desc><defs><mask id="export-sun-moon-sun-moon-body-apertures"><rect width="100%" height="100%" fill="white"/><rect x="264" y="318" width="412" height="270" rx="3" fill="black"/></mask></defs><g id="export-sun-moon-body" mask="url(#export-sun-moon-sun-moon-body-apertures)">
