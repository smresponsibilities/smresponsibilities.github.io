<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 760" fill="none"><title>Hoenn · Ruby / Sapphire</title><desc>Authored flat interface asset. User-selected revision 47 landscape RSE treatment. The right crescent closes sideways around the exposed disc. This motion is a deliberate visual preference and is not presented as canonical hinge construction. Release art supplies the component inventory; exact depth and unpictured exterior remain inferred. Controls retain portfolio actions, with an inert blue disc centre, red lamp and green lid lens.</desc><defs><mask id="export-ruby-ruby-lid-apertures"><rect width="100%" height="100%" fill="white"/></mask></defs><g id="export-ruby-lid" mask="url(#export-ruby-ruby-lid-apertures)"><defs><linearGradient id="export-ruby-ruby-shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9e45"/><stop offset=".5" stop-color="#ff781b"/><stop offset="1" stop-color="#cf4710"/></linearGradient></defs><path data-part="ruby-side-lid" d="M494 219H878Q898 219 903 237L911 317A85 85 0 1 0 911 453L903 522Q900 540 878 540H494Z" fill="url(#export-ruby-ruby-shell)" stroke="#603020" stroke-width="3" stroke-linejoin="round"/><path d="M506 230H878Q889 230 892 243L903 308" fill="none" stroke="#ffc575" stroke-width="3" stroke-linecap="round"/><path d="M506 528H878Q889 528 892 515L903 462" fill="none" stroke="#cb4714" stroke-width="3" stroke-linecap="round"/><circle cx="569" cy="380" r="36" fill="#304337" stroke="#603020" stroke-width="3"/><circle cx="569" cy="380" r="28" fill="#37ca45" stroke="#20552c" stroke-width="2"/><path d="M551 369Q559 357 573 359" fill="none" stroke="#c9ffbb" stroke-width="4" stroke-linecap="round"/><path d="M520 250H847M520 510H847" fill="none" stroke="#d95a15" stroke-width="2" stroke-linecap="round"/></g></svg>