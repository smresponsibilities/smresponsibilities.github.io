<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 760" fill="none"><title>Sinnoh · Diamond / Pearl</title><desc>Authored flat interface asset. Authored front elevation using one Diamond/Pearl game-art shell. Both lid faces share the complete outline, including the semicircular left extension. The closed exterior remains reconstructed. Speaker holes, the lid dot, pod indicator, and small dark pod inset are inert.</desc><defs><mask id="export-diamond-diamond-hinge-apertures"><rect width="100%" height="100%" fill="white"/></mask></defs><g id="export-diamond-hinge" mask="url(#export-diamond-diamond-hinge-apertures)"><rect x="280" y="365" width="446" height="39" rx="12" fill="#b92749" stroke="#582a34" stroke-width="3"/><rect x="286" y="368" width="434" height="29" rx="9" fill="#eb4763" stroke="#582a34" stroke-width="2"/><path d="M295 375H711" fill="none" stroke="#ff9aa6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 367V399M348 367V399M660 367V399M678 367V399" fill="none" stroke="#582a34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="498" y="375" width="8" height="16" rx="2" fill="#343b3b" stroke="#343b3b" stroke-width="2"/></g></svg>