<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 760" fill="none"><title>Johto · Gold / Silver</title><desc>Authored flat interface asset. Authored front elevation with widened screen apertures. The upper dome now projects above the open leaf and the lower blue orb remains visible at the closed endpoint, matching the GSC artwork. Unseen leaf returns, hinge faces and leaf trajectories remain reconstructed. The two blue orbs are inert; button actions are portfolio adaptations.</desc><defs><mask id="export-gold-gold-right-leaf-apertures"><rect width="100%" height="100%" fill="white"/></mask></defs><g id="export-gold-right-leaf" mask="url(#export-gold-gold-right-leaf-apertures)"><defs><linearGradient id="export-gold-gold-shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ca2c44"/><stop offset=".5" stop-color="#b51f38"/><stop offset="1" stop-color="#8f162f"/></linearGradient></defs><g transform="translate(980 0) scale(-1 1)"><path data-part="gold-closed-right-fit" d="M66 542H486V690H66Z" fill="url(#export-gold-gold-shell)" stroke="#510e21" stroke-width="3" stroke-linejoin="round"/><path d="M78 559H474V680H78Z" fill="#b9223c" stroke="#510e21" stroke-width="2" stroke-linejoin="round"/><path d="M89 573V674H458" fill="none" stroke="#e45b6d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M819 592L861 581V653L819 663Z" fill="#85142b" stroke="#510e21" stroke-width="2" stroke-linejoin="round"/><path d="M534 603V653H779" fill="none" stroke="#85142b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></svg>