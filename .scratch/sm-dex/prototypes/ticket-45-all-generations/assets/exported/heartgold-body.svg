<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 760" fill="none"><title>Johto · HeartGold / SoulSilver</title><desc>Authored flat interface asset. Authored flat interpretation of the orange HGSS model. The source-visible round projection now clears the open top edge. The top leaf folds down across y=380; its exterior uses reflected closed coordinates. The relation between the open round projection and closed trapezoidal handle remains unresolved, so their mounting and hidden transition surfaces are reconstructed. Lamps, the blue lens and gold rails are inert; navigation belongs to labelled screen controls.</desc><defs><mask id="export-heartgold-heartgold-body-apertures"><rect width="100%" height="100%" fill="white"/><rect x="341" y="431" width="258" height="170" rx="3" fill="black"/></mask></defs><g id="export-heartgold-body" mask="url(#export-heartgold-heartgold-body-apertures)"><defs><linearGradient id="export-heartgold-hgss-shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f18b63"/><stop offset=".5" stop-color="#db6948"/><stop offset="1" stop-color="#ad4836"/></linearGradient></defs><g stroke="#533d35" stroke-width="3" stroke-linejoin="round">
