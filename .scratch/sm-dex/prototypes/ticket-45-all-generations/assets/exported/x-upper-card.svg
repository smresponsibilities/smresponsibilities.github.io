<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 760" fill="none"><title>Kalos · X / Y</title><desc>Authored flat interface asset. Authored interpretation of the official X/Y card artwork, also archived at https://archives.bulbagarden.net/wiki/File:XY_Pok%C3%A9dex.png. The upper and lower red halves separate vertically around one transparent cyan display. Their semicircular rims retain a luminous centre and narrow seam when compact. The 126-unit travel per half and concealed screen construction are inferred from still artwork. No physical key functions are established, so navigation uses labelled screen controls.</desc><defs><mask id="export-x-x-upper-card-apertures"><rect width="100%" height="100%" fill="white"/></mask></defs><g id="export-x-upper-card" mask="url(#export-x-x-upper-card-apertures)"><g stroke="#552633" stroke-width="3" stroke-linejoin="round">
