<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>SM'S DEX — Classic Red control prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1 class="sr-only">SM'S DEX Classic Red interaction prototype</h1>

      <div class="device-frame" id="device-frame">
        <div class="device" id="device" data-open="false" data-mode="closed">
          <section class="stationary" aria-label="Stationary body">
            <div class="screen body-screen" id="primary-screen" aria-live="polite"></div>
            <img class="master-layer body-master" src="assets/stationary-body.png" alt="" />
            <div class="controls controls-body" id="body-controls" inert></div>
          </section>

          <img class="master-layer hinge" src="assets/stationary-hinge.png" alt="" />

          <section class="leaf" id="leaf" aria-label="Moving lid">
            <div class="leaf-face inner-face" id="inner-face" inert>
              <div class="screen lid-screen" id="secondary-screen" aria-live="polite"></div>
              <img class="master-layer face-master" src="assets/moving-inner-lid.png" alt="" />
              <div class="controls controls-inner" id="inner-controls"></div>
            </div>

            <div class="leaf-face outer-face" id="outer-face">
              <img class="master-layer face-master" src="assets/moving-outer-cover.png" alt="" />
              <div class="controls controls-outer" id="outer-controls"></div>
            </div>
          </section>

          <div id="screen-hub" hidden></div>
        </div>
      </div>

      <p class="sr-only" id="control-help">
        Arrow keys operate the D-pad. Enter confirms. Escape goes back. Physical START opens the
        main menu and SELECT changes the version entry.
      </p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
